<script>

/* =================================================
   TELEGRAM
================================================= */

        "tg://resolve?domain=tvlatin2021";

/* =================================================
   API
================================================= */

const API =
    "https://api.wqxag.com/diaries.json";


/* =================================================
   SERVIDOR DE IMAGENES
================================================= */

const API_BASE =
    "https://api.wqxag.com";


/* =================================================
   IMAGEN POR DEFECTO
================================================= */

const IMAGEN_DEFAULT =
    "https://api.wqxag.com/uploads/sin_imagen_d36205f0e8.png";


/* =================================================
   FECHA
================================================= */

function fechaHoy(){

    const hoy =
        new Date();


    const opciones = {

        weekday:'long',

        year:'numeric',

        month:'long',

        day:'numeric'

    };


    document.getElementById(
        "fecha"
    ).innerText =

        hoy.toLocaleDateString(
            'es-ES',
            opciones
        );

}


/* =================================================
   CONVERTIR HORA
================================================= */

function convertirHora(hora){

    if(!hora){

        return "";

    }


    const partes =
        String(hora).split(":");


    if(partes.length < 2){

        return hora;

    }


    let h =
        parseInt(
            partes[0],
            10
        );


    let m =
        parseInt(
            partes[1],
            10
        );


    if(
        isNaN(h) ||
        isNaN(m)
    ){

        return hora;

    }


    const periodo =
        h >= 12
            ? "PM"
            : "AM";


    let hora12 =
        h % 12;


    if(hora12 === 0){

        hora12 = 12;

    }


    return (

        String(hora12).padStart(2,"0") +

        ":" +

        String(m).padStart(2,"0") +

        " " +

        periodo

    );

}


/* =================================================
   ABRIR / CERRAR CANALES
================================================= */

function toggle(id){

    const el =
        document.getElementById(
            "links" + id
        );


    if(!el){

        return;

    }


    const visible =
        el.style.display === "block";


    el.style.display =
        visible
            ? "none"
            : "block";


    const evento =
        document.querySelector(
            '[data-evento="' + id + '"]'
        );


    if(evento){

        const flecha =
            evento.querySelector(
                ".flecha"
            );


        if(flecha){

            flecha.style.transform =
                visible
                    ? "rotate(0deg)"
                    : "rotate(180deg)";

        }

    }

}


/* =================================================
   LIMPIAR URL
================================================= */

function limpiarURL(url){

    if(!url){

        return "";

    }


    url =
        String(url).trim();


    /* IFRAME */

    if(
        url.toLowerCase()
        .includes("<iframe")
    ){

        const match =
            url.match(
                /src=["']([^"']+)["']/i
            );


        if(match){

            url =
                match[1];

        }

    }


    url =
        url.trim();


    /* QUITAR RUTA EMBED */

    url =
        url.replace(
            "/embed/eventos.html",
            ""
        );


    /*
       DECODIFICAR ?r=
    */

    if(
        url.includes("?r=")
    ){

        const parts =
            url.split("?r=");


        if(parts[1]){

            try{

                url =
                    atob(
                        decodeURIComponent(
                            parts[1]
                        )
                    );

            }
            catch(e){

                console.log(
                    "Error Base64:",
                    e
                );

            }

        }

    }


    /* PROTOCOLO */

    if(
        url.startsWith("//")
    ){

        url =
            "https:" + url;

    }


    /* RUTA RELATIVA */

    if(
        url.startsWith("/")
    ){

        url =
            "https://la14hd.com" + url;

    }


    /* HTTPS */

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        url =
            "https://" + url;

    }


    return url;

}


/* =================================================
   OBTENER EMBEDS
================================================= */

function obtenerEmbeds(attributes){

    if(!attributes){

        return [];

    }


    if(
        attributes.embeds &&
        Array.isArray(
            attributes.embeds.data
        )
    ){

        return attributes.embeds.data;

    }


    if(
        Array.isArray(
            attributes.embeds
        )
    ){

        return attributes.embeds;

    }


    return [];

}


/* =================================================
   OBTENER ICONO DEL EVENTO
================================================= */

function obtenerIcono(attributes){

    let url = "";


    try{

        url =
            attributes
            ?.country
            ?.data
            ?.attributes
            ?.image
            ?.data
            ?.attributes
            ?.url || "";

    }
    catch(e){

        url = "";

    }


    if(!url){

        return IMAGEN_DEFAULT;

    }


    /*
       SI YA ES URL COMPLETA
    */

    if(
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ){

        return url;

    }


    /*
       SI ES RUTA /uploads/...
    */

    if(
        url.startsWith("/")
    ){

        return API_BASE + url;

    }


    /*
       CUALQUIER OTRA RUTA
    */

    return API_BASE + "/" + url;

}


/* =================================================
   LIMPIAR NOMBRE
================================================= */

function limpiarDescripcion(texto){

    if(!texto){

        return "Evento deportivo";

    }


    return String(texto)

        .replace(
            /\r?\n/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escaparHTML(texto){

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================
   CARGAR AGENDA
================================================= */

async function cargarAgenda(){

    const agenda =
        document.getElementById(
            "agenda"
        );


    agenda.innerHTML = `

        <div class="mensaje">

            ⏳ Cargando eventos...

        </div>

    `;


    try{

        const respuesta =
            await fetch(
                API,
                {
                    method:"GET",

                    cache:"no-store"
                }
            );


        if(!respuesta.ok){

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }


        const data =
            await respuesta.json();


        if(
            !data ||
            !Array.isArray(
                data.data
            )
        ){

            throw new Error(
                "Formato de API incorrecto"
            );

        }


        let eventos =
            data.data;


        /*
        ==========================================
        FILTRO FUTBOL
        ==========================================

        Si el API tiene deportes,
        se filtra fútbol.

        Si no tiene deportes,
        se permite el evento.
        */

        eventos =
            eventos.filter(
                function(evento){

                    const a =
                        evento.attributes ||
                        {};


                    if(!a.deportes){

                        return true;

                    }


                    return String(
                        a.deportes
                    )
                    .toLowerCase()
                    .includes(
                        "futbol"
                    );

                }
            );


        /*
        ==========================================
        ORDENAR
        ==========================================
        */

        eventos.sort(
            function(a,b){

                const horaA =
                    a.attributes
                    ?.diary_hour ||
                    "00:00";


                const horaB =
                    b.attributes
                    ?.diary_hour ||
                    "00:00";


                return String(
                    horaA
                ).localeCompare(
                    String(
                        horaB
                    )
                );

            }
        );


        if(
            eventos.length === 0
        ){

            agenda.innerHTML = `

                <div class="mensaje">

                    ⚠️ No hay eventos disponibles.

                </div>

            `;

            return;

        }


        let html = "";


        /*
        ==========================================
        CREAR EVENTOS
        ==========================================
        */

        eventos.forEach(
            function(evento,i){

                const a =
                    evento.attributes ||
                    {};


                /*
                HORA
                */

                const hora =
                    convertirHora(
                        a.diary_hour ||
                        ""
                    );


                /*
                DESCRIPCIÓN
                */

                const desc =
                    limpiarDescripcion(
                        a.diary_description
                    );


                /*
                ICONO
                */

                const icono =
                    obtenerIcono(a);


                /*
                EMBEDS
                */

                const embeds =
                    obtenerEmbeds(a);


                /*
                EVENTO
                */

                html += `

                <div

                    class="partido"

                    data-evento="${i}"

                    onclick="toggle(${i})"

                >

                    <div class="info">


                        <div class="hora">

                            ${escaparHTML(
                                hora
                            )}

                        </div>


                        <img

                            class="bandera"

                            src="${escaparHTML(
                                icono
                            )}"

                            alt="Icono"

                            loading="lazy"

                            onerror="this.onerror=null;this.src='${IMAGEN_DEFAULT}'"

                        >


                        <div class="nombre-evento">

                            ${escaparHTML(
                                desc
                            )}

                        </div>


                        <div class="flecha">

                            ▼

                        </div>


                    </div>


                    <div

                        class="links"

                        id="links${i}"

                    >

                `;


                /*
                ==================================
                SIN ENLACES
                ==================================
                */

                if(
                    embeds.length === 0
                ){

                    html += `

                        <div

                            style="
                                color:#94a3b8;
                                padding:8px 0;
                                text-align:center;
                            "

                        >

                            No hay enlaces disponibles

                        </div>

                    `;

                }

                else{


                    /*
                    ==================================
                    CREAR CANALES
                    ==================================
                    */

                    embeds.forEach(
                        function(embed){

                            const ea =
                                embed?.attributes ||
                                embed ||
                                {};


                            const nombre =
                                ea.embed_name ||
                                "Ver canal";


                            const iframe =
                                ea.embed_iframe ||
                                ea.embed_url ||
                                ea.url ||
                                "";


                            if(!iframe){

                                return;

                            }


                            const urlOriginal =
                                limpiarURL(
                                    iframe
                                );


                            if(!urlOriginal){

                                return;

                            }


                            /*
                            PLAYER
                            */

                            const urlPlayer =

                                "https://verfutbollibre.github.io/eventos.html?r=" +

                                encodeURIComponent(

                                    btoa(
                                        urlOriginal
                                    )

                                );


                            html += `

                                <a

                                    href="${urlPlayer}"

                                    target="_blank"

                                    rel="noopener noreferrer"

                                    onclick="event.stopPropagation();"

                                >

                                    ▶ ${escaparHTML(
                                        nombre
                                    )}

                                </a>

                            `;

                        }
                    );

                }


                html += `

                    </div>

                </div>

                `;

            }
        );


        /*
        ==========================================
        MOSTRAR AGENDA
        ==========================================
        */

        agenda.innerHTML =
            html;


    }

    catch(error){

        console.error(
            "ERROR API:",
            error
        );


        agenda.innerHTML = `

            <div

                class="mensaje"

                style="
                    color:#f87171;
                "

            >

                ❌ No se pudo cargar la agenda.

                <br><br>

                <small

                    style="
                        color:#94a3b8;
                    "

                >

                    ${escaparHTML(
                        error.message
                    )}

                </small>

            </div>

        `;

    }

}


/* =================================================
   INICIAR
================================================= */

fechaHoy();

cargarAgenda();


/* =================================================
   ACTUALIZAR CADA 60 SEGUNDOS
================================================= */

setInterval(

    cargarAgenda,

    60000

);

</script>
