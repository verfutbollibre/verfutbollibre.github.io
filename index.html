<script>

const API="https://agenda18.com/agenda.json?v=1.12";

/* fecha automática */

function fechaHoy(){

let hoy=new Date();

let opciones={
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
};

document.getElementById("fecha").innerText=
hoy.toLocaleDateString('es-ES',opciones);

}

/* convertir hora */

function convertirHora(hora){

if(!hora) return "";

let h=hora.split(":");

let date=new Date();

date.setHours(h[0]);
date.setMinutes(h[1]);

return date.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

/* abrir lista de canales */

function toggle(id){

let el=document.getElementById("links"+id);

el.style.display=
el.style.display==="block" ? "none":"block";

}

/* limpiar URL del iframe */

function limpiarURL(url){

if(!url) return "";

/* si viene iframe */

if(url.includes("<iframe")){
let match=url.match(/src="([^"]+)"/);
if(match) url=match[1];
}

url=url.trim();

/* quitar rutas embed rotas */

url=url.replace("/embed/eventos.html","");

/* evitar doble base64 */

if(url.includes("?r=")){
let parts=url.split("?r=");
if(parts[1]){
try{
url=atob(parts[1]);
}catch(e){}
}
}

/* protocolo */

if(url.startsWith("//")){
url="https:"+url;
}

/* ruta relativa */

if(url.startsWith("/")){
url="https://la14hd.com"+url;
}

/* si no tiene http */

if(!url.startsWith("http")){
url="https://"+url;
}

return url;

}

/* cargar agenda */

async function cargarAgenda(){

try{

let res=await fetch(API);
let data=await res.json();
    
let html="";

data.data
.filter(e=>e.attributes.deportes.toLowerCase()=="futbol")
.sort((a,b)=>a.attributes.diary_hour.localeCompare(b.attributes.diary_hour))
.forEach((evento,i)=>{

let hora=convertirHora(evento.attributes.diary_hour);
let desc=evento.attributes.diary_description;

let bandera="https://img.agenda18.com/uploads/sin_imagen_d36205f0e8.png";

if(evento.attributes.country.data){

bandera="https://img.agenda18.com"+
evento.attributes.country.data.attributes.image.data.attributes.url;

}

html+=`

<div class="partido" onclick="toggle(${i})">

<div class="info">
<div class="hora">${hora}</div>
<img class="bandera" src="${bandera}">
<div>${desc}</div>
</div>

<div class="links" id="links${i}">
`;

evento.attributes.embeds.data.forEach(embed=>{

if(embed){

let urlOriginal=limpiarURL(embed.attributes.embed_iframe);

/* enviar al reproductor */

let urlPlayer="https://verfutbollibre.github.io/eventos.html?r="+encodeURIComponent(btoa(urlOriginal));

html+=`
<a href="${urlPlayer}">
▶ ${embed.attributes.embed_name}
</a>
`;

}

});

html+=`</div></div>`;

});

document.getElementById("agenda").innerHTML=html;

}catch(e){

document.getElementById("agenda").innerHTML="Error cargando eventos";

}

}

/* iniciar */

fechaHoy();
cargarAgenda();

/* actualizar agenda */

setInterval(cargarAgenda,60000);

</script>

</body>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // 🔧 CONFIGURA AQUÍ
    // Horario original del listado (ejemplo: España = +1)
    const zonaOrigen = 1;

    // Horario destino
    // Perú / Colombia = -5
    const zonaDestino = -5;

    const diferencia = zonaDestino - zonaOrigen;

    document.querySelectorAll(".t").forEach(function(el) {

        const texto = el.textContent.trim();
        if(!texto.includes(":")) return;

        let [h, m] = texto.split(":").map(Number);

        h = h + diferencia;

        if (h < 0) h += 24;
        if (h >= 24) h -= 24;

        el.textContent =
            String(h).padStart(2, "0") + ":" +
            String(m).padStart(2, "0");

    });

});
</script>

<script>
(function() {

  const API =
    "https://agenda-gotplay.pollitolalo3334.workers.dev/";

  const contenedor =
    document.getElementById("agenda-futbol");


  function escapar(texto) {

    if (
      texto === null ||
      texto === undefined
    ) {
      return "";
    }

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function fechaBonita(fecha) {

    if (!fecha) return "";

    const p =
      fecha.split("-");

    if (p.length !== 3) {
      return fecha;
    }

    const d =
      new Date(
        Number(p[0]),
        Number(p[1]) - 1,
        Number(p[2])
      );

    return d.toLocaleDateString(
      "es-PE",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );

  }


  function horaBonita(hora) {

    if (!hora) return "";

    return hora.substring(0, 5);

  }


  function abrirOpciones(id) {

    const elemento =
      document.getElementById(
        "opciones-" + id
      );

    const flecha =
      document.getElementById(
        "flecha-" + id
      );

    if (!elemento) return;


    elemento.classList.toggle(
      "abierto"
    );


    if (
      elemento.classList.contains(
        "abierto"
      )
    ) {

      flecha.innerHTML = "▲";

    } else {

      flecha.innerHTML = "▼";

    }

  }


  /*
   * CARGAR JSON
   */

  fetch(
    API + "?t=" + Date.now(),
    {
      cache: "no-store"
    }
  )

  .then(function(respuesta) {

    if (!respuesta.ok) {

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }

    return respuesta.json();

  })

  .then(function(json) {

    console.log(
      "AGENDA:",
      json
    );


    const partidos =
      json.data;


    if (
      !Array.isArray(partidos) ||
      partidos.length === 0
    ) {

      contenedor.innerHTML =
        '<div class="sin-opciones">' +
        'No hay eventos disponibles.' +
        '</div>';

      return;

    }


    let html = "";

    let fechaAnterior = "";

    let contador = 0;


    partidos.forEach(
      function(partido) {

        const a =
          partido.attributes || {};


        const id =
          partido.id ||
          contador++;


        const fecha =
          a.date_diary || "";


        const hora =
          a.diary_hour || "";


        const descripcion =
          a.diary_description || "";


        /*
         * SEPARAR COMPETENCIA
         * Y EQUIPOS
         */

        let competencia = "";

        let equipos = "";


        if (
          descripcion.indexOf(
            "\n"
          ) !== -1
        ) {

          const partes =
            descripcion.split("\n");


          competencia =
            partes[0].trim();


          equipos =
            partes
              .slice(1)
              .join(" ")
              .trim();

        } else {

          equipos =
            descripcion.trim();

        }


        /*
         * NUEVA FECHA
         */

        if (
          fecha !== fechaAnterior
        ) {

          if (
            fechaAnterior !== ""
          ) {

            html +=
              "</div>";

          }


          html +=
            '<div class="dia">';


          html +=
            '<div class="fecha">' +
            '📅 ' +
            escapar(
              fechaBonita(fecha)
            ) +
            '</div>';


          fechaAnterior =
            fecha;

        }


        /*
         * PARTIDO
         */

        html +=
          '<div class="partido">';


        /*
         * CABECERA CLICKEABLE
         */

        html +=
          '<div class="partido-cabecera" ' +
          'onclick="abrirOpciones(' +
          id +
          ')">';


        html +=
          '<div class="hora">' +
          escapar(
            horaBonita(hora)
          ) +
          '</div>';


        html +=
          '<div class="info">';


        if (competencia) {

          html +=
            '<div class="competencia">' +
            escapar(
              competencia
            ) +
            '</div>';

        }


        html +=
          '<div class="equipos">' +
          escapar(
            equipos
          ) +
          '</div>';


        html +=
          '</div>';


        html +=
          '<div class="flecha" ' +
          'id="flecha-' +
          id +
          '">' +
          '▼' +
          '</div>';


        html +=
          '</div>';


        /*
         * OPCIONES
         */

        html +=
          '<div class="opciones" ' +
          'id="opciones-' +
          id +
          '">';


        let embeds = [];


        if (
          a.embeds &&
          Array.isArray(
            a.embeds.data
          )
        ) {

          embeds =
            a.embeds.data;

        }


        if (
          embeds.length === 0
        ) {

          html +=
            '<div class="sin-opciones">' +
            'No hay opciones disponibles.' +
            '</div>';

        } else {


          embeds.forEach(
            function(embed) {

              const ea =
                embed.attributes ||
                {};


              const nombre =
                ea.embed_name ||
                "Ver transmisión";


              let iframe =
                ea.embed_iframe ||
                "";


              /*
               * Si la URL viene relativa
               */

              if (
                iframe &&
                iframe.charAt(0) === "/"
              ) {

                iframe =
                  "https://futbollibretv.net.pe" +
                  iframe;

              }


              /*
               * Si es una URL válida,
               * crear botón
               */

              if (iframe) {

                html +=
                  '<a class="opcion" ' +
                  'href="' +
                  escapar(iframe) +
                  '" ' +
                  'target="_blank" ' +
                  'rel="noopener noreferrer">' +
                  '📺 ' +
                  escapar(nombre) +
                  '</a>';

              } else {

                html +=
                  '<div class="sin-opciones">' +
                  escapar(nombre) +
                  '</div>';

              }

            }
          );

        }


        html +=
          '</div>';


        html +=
          '</div>';

      }
    );


    if (
      fechaAnterior !== ""
    ) {

      html +=
        "</div>";

    }


    contenedor.innerHTML =
      html;

  })


  .catch(function(error) {

    console.error(
      "ERROR:",
      error
    );


    contenedor.innerHTML =
      '<div class="sin-opciones">' +
      '❌ Error cargando la agenda: ' +
      escapar(
        error.message
      ) +
      '</div>';

  });


})();
</script>
