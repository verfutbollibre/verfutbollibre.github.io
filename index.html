<style>

/* =========================

body{

</head>


<body>


<!-- =========================
     TITULO
========================= -->

<div class="titulo">
    ⚽ Agenda
</div>


<div class="fecha" id="fecha"></div>


<!-- =========================
     AGENDA
========================= -->

<div id="agenda">
    Cargando eventos...
</div>



<!-- ==================================================
     BANNER 320x50 FIJO
     INDEPENDIENTE DE LA AGENDA
================================================== -->

<div class="banner-fijo">

<script>

atOptions = {

    'key' : '87d1ec21e806c5b1a6ac11839d2f031a',

    'format' : 'iframe',

    'height' : 50,

    'width' : 320,

    'params' : {}

};

</script>


<script src="https://www.highrevenueformat.com/87d1ec21e806c5b1a6ac11839d2f031a/invoke.js"></script>

</div>



<script>

/* =========================
   API DE LA AGENDA
========================= */

const API="https://agenda18.com/agenda.json?v=1.12";


/* =========================
   FECHA AUTOMÁTICA
========================= */

function fechaHoy(){

    let hoy=new Date();

    let opciones={

        weekday:'long',

        year:'numeric',

        month:'long',

        day:'numeric'

    };

    document.getElementById("fecha").innerText=

        hoy.toLocaleDateString(
            'es-ES',
            opciones
        );

}


/* =========================
   CONVERTIR HORA
========================= */

function convertirHora(hora){

    if(!hora) return "";

    let h=hora.split(":");

    let date=new Date();

    date.setHours(h[0]);

    date.setMinutes(h[1]);

    return date.toLocaleTimeString([],{

        hour:'2-digit',

        minute:'2-digit'

    });

}


/* =========================
   ABRIR / CERRAR CANALES
========================= */

function toggle(id){

    let el=document.getElementById(
        "links"+id
    );

    el.style.display=

        el.style.display==="block"

        ? "none"

        : "block";

}


/* =========================
   LIMPIAR URL DEL IFRAME
========================= */

function limpiarURL(url){

    if(!url) return "";


    /* Si viene iframe */

    if(url.includes("<iframe")){

        let match=url.match(
            /src="([^"]+)"/
        );

        if(match)

            url=match[1];

    }


    url=url.trim();


    /* Quitar rutas embed */

    url=url.replace(
        "/embed/eventos.html",
        ""
    );


    /* Evitar doble base64 */

    if(url.includes("?r=")){

        let parts=url.split("?r=");

        if(parts[1]){

            try{

                url=atob(parts[1]);

            }catch(e){}

        }

    }


    /* Protocolo */

    if(url.startsWith("//")){

        url="https:"+url;

    }


    /* Ruta relativa */

    if(url.startsWith("/")){

        url=
            "https://la14hd.com"+url;

    }


    /* Si no tiene http */

    if(!url.startsWith("http")){

        url="https://"+url;

    }


    return url;

}


/* =========================
   CARGAR AGENDA
========================= */

async function cargarAgenda(){

    try{

        let res=await fetch(API);

        let data=await res.json();

        let html="";


        data.data

        .filter(e =>

            e.attributes.deportes
            .toLowerCase()=="futbol"

        )

        .sort((a,b) =>

            a.attributes.diary_hour
            .localeCompare(
                b.attributes.diary_hour
            )

        )

        .forEach((evento,i)=>{


            let hora=

                convertirHora(
                    evento.attributes.diary_hour
                );


            let desc=

                evento.attributes
                .diary_description;


            /* Bandera */

            let bandera=

                "https://img.agenda18.com/uploads/sin_imagen_d36205f0e8.png";


            if(
                evento.attributes.country.data
            ){

                bandera=

                    "https://img.agenda18.com"+

                    evento.attributes.country
                    .data.attributes.image
                    .data.attributes.url;

            }


            /* Evento */

            html+=`

            <div
                class="partido"
                onclick="toggle(${i})"
            >

                <div class="info">

                    <div class="hora">
                        ${hora}
                    </div>

                    <img
                        class="bandera"
                        src="${bandera}"
                    >

                    <div>
                        ${desc}
                    </div>

                </div>


                <div
                    class="links"
                    id="links${i}"
                >
            `;


            /* Enlaces */

            evento.attributes.embeds.data
            .forEach(embed=>{

                if(embed){

                    let urlOriginal=

                        limpiarURL(
                            embed.attributes
                            .embed_iframe
                        );


                    /* Enviar al reproductor */

                    let urlPlayer=

                        "https://verfutbollibre.github.io/eventos.html?r="+

                        encodeURIComponent(
                            btoa(urlOriginal)
                        );


                    html+=`

                    <a
                        href="${urlPlayer}"
                    >

                        ▶
                        ${embed.attributes.embed_name}

                    </a>

                    `;

                }

            });


            html+=`

                </div>

            </div>

            `;

        });


        document.getElementById(
            "agenda"
        ).innerHTML=html;


    }catch(e){

        document.getElementById(
            "agenda"
        ).innerHTML=
            "Error cargando eventos";

    }

}


/* =========================
   INICIAR
========================= */

fechaHoy();

cargarAgenda();


/* =========================
   ACTUALIZAR AGENDA
   CADA 60 SEGUNDOS
========================= */

setInterval(
    cargarAgenda,
    60000
);

</script>


</body>

</html>
