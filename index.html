<script>

/* =================================================
   TELEGRAM
================================================= */

function abrirTelegram(event){

    event.preventDefault();

    /*
       Enlace directo a la aplicación
    */

    const telegramApp =
        "tg://resolve?domain=tvlatin2021";


    /*
       Enlace web alternativo
    */

    const telegramWeb =
        "https://t.me/tvlatin2021";


    /*
       Intentar abrir Telegram
    */

    window.location.href = telegramApp;


    /*
       Si no se abrió la aplicación,
       intentar versión web.
    */

    setTimeout(function(){

        window.location.href =
            telegramWeb;

    },1500);

}


/* =================================================
   API DE LA AGENDA
================================================= */

const API =
    "https://agenda18.com/agenda.json?v=1.12";


/* =================================================
   FECHA AUTOMÁTICA
================================================= */

function fechaHoy(){

    let hoy = new Date();

    let opciones = {

        weekday:'long',

        year:'numeric',

        month:'long',

        day:'numeric'

    };

    document.getElementById("fecha").innerText =

        hoy.toLocaleDateString(

            'es-ES',

            opciones

        );

}


/* =================================================
   CONVERTIR HORA
================================================= */

function convertirHora(hora){

    if(!hora)

        return "";


    let h = hora.split(":");


    let date = new Date();


    date.setHours(h[0]);

    date.setMinutes(h[1]);


    return date.toLocaleTimeString(

        [],

        {

            hour:'2-digit',

            minute:'2-digit'

        }

    );

}


/* =================================================
   ABRIR / CERRAR CANALES
================================================= */

function toggle(id){

    let el = document.getElementById(

        "links" + id

    );


    if(!el)

        return;


    el.style.display =

        el.style.display === "block"

            ? "none"

            : "block";

}


/* =================================================
   LIMPIAR URL
================================================= */

function limpiarURL(url){

    if(!url)

        return "";


    /*
       Si viene iframe
    */

    if(url.includes("<iframe")){

        let match = url.match(

            /src="([^"]+)"/

        );


        if(match)

            url = match[1];

    }


    url = url.trim();


    /*
       Quitar rutas embed
    */

    url = url.replace(

        "/embed/eventos.html",

        ""

    );


    /*
       Evitar doble base64
    */

    if(url.includes("?r=")){

        let parts = url.split("?r=");


        if(parts[1]){

            try{

                url = atob(parts[1]);

            }

            catch(e){

                console.log(

                    "Error decodificando URL"

                );

            }

        }

    }


    /*
       Protocolo
    */

    if(url.startsWith("//")){

        url = "https:" + url;

    }


    /*
       Ruta relativa
    */

    if(url.startsWith("/")){

        url =
            "https://la14hd.com" + url;

    }


    /*
       Si no tiene http
    */

    if(!url.startsWith("http")){

        url = "https://" + url;

    }


    return url;

}


/* =================================================
   CARGAR AGENDA
================================================= */

async function cargarAgenda(){

    try{

        let res = await fetch(API);


        let data = await res.json();


        let html = "";


        data.data

        .filter(e =>

            e.attributes.deportes &&

            e.attributes.deportes

                .toLowerCase() == "futbol"

        )


        .sort((a,b) =>

            a.attributes.diary_hour

                .localeCompare(

                    b.attributes.diary_hour

                )

        )


        .forEach((evento,i)=>{


            /*
               HORA
            */

            let hora =

                convertirHora(

                    evento.attributes

                        .diary_hour

                );


            /*
               DESCRIPCION
            */

            let desc =

                evento.attributes

                    .diary_description || "";


            /*
               BANDERA
            */

            let bandera =

                "https://img.agenda18.com/uploads/sin_imagen_d36205f0e8.png";


            if(

                evento.attributes.country &&

                evento.attributes.country.data &&

                evento.attributes.country.data.attributes &&

                evento.attributes.country.data.attributes.image &&

                evento.attributes.country.data.attributes.image.data

            ){

                bandera =

                    "https://img.agenda18.com" +

                    evento.attributes.country

                        .data.attributes.image

                        .data.attributes.url;

            }


            /*
               EVENTO
            */

            html += `

            <div

                class="partido"

                onclick="toggle(${i})"

            >

                <div class="info">

                    <div class="hora">

                        ${hora}

                    </div>


                    <img

                        class="bandera"

                        src="${bandera}"

                    >


                    <div>

                        ${desc}

                    </div>

                </div>


                <div

                    class="links"

                    id="links${i}"

                >

            `;


            /*
               ENLACES
            */

            if(

                evento.attributes.embeds &&

                evento.attributes.embeds.data

            ){

                evento.attributes.embeds.data

                    .forEach(embed=>{


                        if(embed){


                            let urlOriginal =

                                limpiarURL(

                                    embed.attributes

                                        .embed_iframe

                                );


                            /*
                               URL DEL PLAYER
                            */

                            let urlPlayer =

                                "https://verfutbollibre.github.io/eventos.html?r=" +

                                encodeURIComponent(

                                    btoa(urlOriginal)

                                );


                            html += `

                            <a

                                href="${urlPlayer}"

                                onclick="event.stopPropagation();"

                            >

                                ▶

                                ${embed.attributes.embed_name}

                            </a>

                            `;

                        }

                    });

            }


            html += `

                </div>

            </div>

            `;

        });


        /*
           MOSTRAR AGENDA
        */

        document.getElementById(

            "agenda"

        ).innerHTML = html;


    }

    catch(e){

        console.error(e);


        document.getElementById(

            "agenda"

        ).innerHTML =

            "Error cargando eventos";

    }

}


/* =================================================
   INICIAR
================================================= */

fechaHoy();

cargarAgenda();


/* =================================================
   ACTUALIZAR AGENDA
================================================= */

setInterval(

    cargarAgenda,

    60000

);

</script>


<!-- =================================================

<script>

document.addEventListener(

    "DOMContentLoaded",

    function(){

        const zonaOrigen = 1;

        const zonaDestino = -5;

        const diferencia =

            zonaDestino - zonaOrigen;


        document

            .querySelectorAll(".t")

            .forEach(function(el){


                const texto =

                    el.textContent.trim();


                if(!texto.includes(":"))

                    return;


                let [h,m] =

                    texto

                        .split(":")

                        .map(Number);


                h = h + diferencia;


                if(h < 0)

                    h += 24;


                if(h >= 24)

                    h -= 24;


                el.textContent =

                    String(h).padStart(2,"0") +

                    ":" +

                    String(m).padStart(2,"0");

            });

    }

);
