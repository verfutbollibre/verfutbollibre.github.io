/* =================================================

function fechaHoy(){

    const hoy =
        new Date();

    const opciones = {

        weekday:"long",

        year:"numeric",

        month:"long",

        day:"numeric"

    };

    document.getElementById("fecha").innerText =

        hoy.toLocaleDateString(
            "es-ES",
            opciones
        );

}


/* =================================================
   CONVERTIR HORA
================================================= */

function convertirHora(hora){

    if(!hora){

        return "";

    }

    const partes =
        String(hora).split(":");

    if(partes.length < 2){

        return hora;

    }

    let h =
        parseInt(
            partes[0],
            10
        );

    let m =
        parseInt(
            partes[1],
            10
        );

    if(
        isNaN(h) ||
        isNaN(m)
    ){

        return hora;

    }

    const periodo =
        h >= 12
            ? "PM"
            : "AM";

    let hora12 =
        h % 12;

    if(hora12 === 0){

        hora12 = 12;

    }

    return (

        String(hora12)
            .padStart(2,"0")

        + ":" +

        String(m)
            .padStart(2,"0")

        + " " +

        periodo

    );

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escaparHTML(valor){

    return String(
        valor ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =================================================
   CONSTRUIR URL DE IMAGEN
================================================= */

function construirImagen(url){

    const imagenPredeterminada =
        IMG_URL +
        "/uploads/sin_imagen_d36205f0e8.png";


    if(!url){

        return imagenPredeterminada;

    }


    url =
        String(url).trim();


    if(
        url.startsWith("https://") ||
        url.startsWith("http://")
    ){

        return url;

    }


    if(
        url.startsWith("//")
    ){

        return "https:" + url;

    }


    if(
        url.startsWith("/")
    ){

        return IMG_URL + url;

    }


    return IMG_URL + "/" + url;

}


/* =================================================
   OBTENER IMAGEN DEL EVENTO
================================================= */

function obtenerImagenEvento(a){

    const predeterminada =
        IMG_URL +
        "/uploads/sin_imagen_d36205f0e8.png";


    if(!a){

        return predeterminada;

    }


    const posibles = [

        a?.country
            ?.data
            ?.attributes
            ?.image
            ?.data
            ?.attributes
            ?.url,

        a?.country
            ?.data
            ?.attributes
            ?.image
            ?.url,

        a?.country
            ?.attributes
            ?.image
            ?.data
            ?.attributes
            ?.url,

        a?.country
            ?.attributes
            ?.image
            ?.url,

        a?.country
            ?.image
            ?.data
            ?.attributes
            ?.url,

        a?.country
            ?.image
            ?.url,

        a?.country
            ?.data
            ?.image
            ?.url

    ];


    const imagen =
        posibles.find(
            function(url){

                return (
                    typeof url === "string" &&
                    url.trim() !== ""
                );

            }
        );

}

/* =================================================
   LIMPIAR URL
================================================= */

function limpiarURL(url){

    if(!url){

        return "";

    }


    url =
        String(url).trim();


    /*
    SI VIENE UN IFRAME
    */

    if(
        url
            .toLowerCase()
            .includes("<iframe")
    ){

        const match =
            url.match(
                /src=["']([^"']+)["']/i
            );


        if(match){

            url =
                match[1];

        }

    }


    url =
        url.trim();


    /*
    SI ES RELATIVA,
    USAR EL DOMINIO DEL API
    */

    let urlCompleta =
        url;


    try{

        urlCompleta =
            new URL(
                url,
                API
            ).href;

    }

    catch(error){

        urlCompleta =
            url;

    }


    /*
    DECODIFICAR ?r=
    */

    try{

        const objetoURL =
            new URL(
                urlCompleta
            );


        const parametro =
            objetoURL.searchParams.get(
                "r"
            );


        if(parametro){

            let decodificado = "";


            try{

                decodificado =
                    atob(
                        parametro
                    );

            }

            catch(error){

                decodificado =
                    atob(
                        decodeURIComponent(
                            parametro
                        )
                    );

            }


            if(decodificado){

                url =
                    decodificado.trim();

            }

        }
        else{

            url =
                urlCompleta;

        }

    }

    catch(error){

        /*
        COMPATIBILIDAD
        */

        if(
            url.includes("?r=")
        ){

            const parts =
                url.split(
                    "?r="
                );


            if(parts[1]){

                try{

                    url =
                        atob(
                            decodeURIComponent(
                                parts[1]
                            )
                        ).trim();

                }

                catch(e){

                    console.log(
                        "No se pudo decodificar Base64"
                    );

                }

            }

        }

    }


    /*
    PROTOCOLO //
    */

    if(
        url.startsWith("//")
    ){

        url =
            "https:" + url;

    }


    /*
    RUTA RELATIVA
    */

    if(
        url.startsWith("/")
    ){

        url =
            API +
            url;

    }


    /*
    HTTPS
    */

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        url =
            "https://" + url;

    }


    return url;

}


/* =================================================
   BASE64
================================================= */

function codificarBase64(texto){

    try{

        return btoa(texto);

    }

    catch(error){

        try{

            return btoa(
                unescape(
                    encodeURIComponent(
                        texto
                    )
                )
            );

        }

        catch(e){

            return "";

        }

    }

}


/* =================================================
   CACHE
================================================= */

function obtenerFechaCache(){

    const ahora =
        new Date();

    const year =
        ahora.getFullYear();

    const month =
        String(
            ahora.getMonth() + 1
        ).padStart(2,"0");

        ).padStart(2,"0");


    return (
        year +
        "-" +

    );

}


function obtenerClaveCache(){

    return (
        "agenda_wqxag_" +
        obtenerFechaCache()
    );

}


function guardarCache(data){

    try{

        localStorage.setItem(

            obtenerClaveCache(),

            JSON.stringify({

                timestamp:
                    Date.now(),

                data:data

            })

        );

    }

    catch(error){

        console.log(
            "No se pudo guardar cache"
        );

    }

}


function cargarCache(){

    try{

        const contenido =
            localStorage.getItem(
                obtenerClaveCache()
            );


        if(!contenido){

            return null;

        }


        const cache =
            JSON.parse(
                contenido
            );


        if(
            !cache ||
            !cache.data ||
            !cache.timestamp
        ){

            return null;

        }


        return cache;

    }

    catch(error){

        return null;

    }

}


/* =================================================
   MOSTRAR AGENDA
================================================= */

function mostrarAgenda(resultado){

    const agenda =
        document.getElementById(
            "agenda"
        );


    if(!agenda){

        return;

    }


    const eventos =
        Array.isArray(resultado)
            ? resultado
            : resultado?.data;


    if(
        !Array.isArray(eventos)
    ){

        return;

    }


    /*
    ORDENAR
    */

    const eventosOrdenados =
        [...eventos].sort(
            function(a,b){

                const horaA =
                    a?.attributes
                    ?.diary_hour ||
                    "00:00";


                const horaB =
                    b?.attributes
                    ?.diary_hour ||
                    "00:00";


                return String(horaA)
                    .localeCompare(
                        String(horaB)
                    );

            }
        );


    let html = "";


    eventosOrdenados.forEach(
        function(evento,i){

            const a =
                evento?.attributes ||
                evento ||
                {};


            const hora =
                convertirHora(
                    a.diary_hour ||
                    a.hour ||
                    ""
                );


            const desc =
                escaparHTML(
                    a.diary_description ||
                    a.description ||
                    a.title ||
                    "Evento deportivo"
                );


            const bandera =
                obtenerImagenEvento(a);


            const embeds =
                obtenerEmbeds(a);


            html += `

                <div
                    class="partido"
                    onclick="toggle(${i})"
                >

                    <div class="info">

                        <div class="hora">

                            ${escaparHTML(hora)}

                        </div>


                        <img
                            class="bandera"
                            src="${escaparHTML(bandera)}"
                            alt=""
                            width="22"
                            height="22"
                            decoding="async"
                            onerror="
                                this.onerror=null;
                                this.src='${IMG_URL}/uploads/sin_imagen_d36205f0e8.png';
                            "
                        >


                        <div class="descripcion">

                            ${desc}

                        </div>

                    </div>


                    <div
                        class="links"
                        id="links${i}"
                    >

            `;


            /*
            EMBEDS
            */

            if(
                embeds.length === 0
            ){

                html += `

                    <div
                        style="
                            color:#94a3b8;
                            padding:8px 0;
                        "
                    >

                        No hay enlaces disponibles

                    </div>

                `;

            }
            else{

                embeds.forEach(
                    function(embed){

                        const ea =
                            embed?.attributes ||
                            embed ||
                            {};


                        const nombre =
                            escaparHTML(
                                ea.embed_name ||
                                ea.name ||
                                "Ver canal"
                            );


                        const iframe =
                            ea.embed_iframe ||
                            ea.embed_url ||
                            ea.url ||
                            ea.link ||
                            "";


                        if(!iframe){

                            return;

                        }


                        const urlOriginal =
                            limpiarURL(
                                iframe
                            );


                        if(!urlOriginal){

                            return;

                        }


                        const base64 =
                            codificarBase64(
                                urlOriginal
                            );


                        if(!base64){

                            return;

                        }


                        const urlPlayer =

                            "https://verfutbollibre.github.io/eventos.html?r=" +

                            encodeURIComponent(
                                base64
                            );


                        html += `

                            <a
                                href="${escaparHTML(urlPlayer)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                onclick="event.stopPropagation();"
                            >

                                ▶ ${nombre}

                            </a>

                        `;

                    }
                );

            }


            html += `

                    </div>

                </div>

            `;

        }
    );


    /*
    SI NO HAY EVENTOS
    */

    if(!html){

        html = `

            <div class="mensaje">

                ⚠️ No hay eventos disponibles.

            </div>

        `;

    }


    /*
    IMPORTANTE:

    SOLO ACTUALIZAR SI REALMENTE CAMBIO.

    Esto evita el parpadeo.
    */

    if(
        html !== ultimoContenido
    ){

        agenda.innerHTML =
            html;

        ultimoContenido =
            html;

    }

}


/* =================================================
   OBTENER AGENDA
================================================= */

async function obtenerAgenda(
    mostrarCargando = false
){

    const agenda =
        document.getElementById(
            "agenda"
        );


    if(!agenda){

        return;

    }


    /*
    EVITAR PETICIONES SIMULTANEAS
    */

    if(solicitudEnCurso){

        return solicitudEnCurso;

    }


    /*
    SOLO MOSTRAR CARGANDO
    SI NO EXISTE NADA
    */

    const cache =
        cargarCache();


    if(
        mostrarCargando &&
        !cache &&
        !ultimoContenido
    ){

        agenda.innerHTML = `

            <div class="mensaje">

                ⏳ Cargando eventos...

            </div>

        `;

    }


    solicitudEnCurso =
        (async function(){

            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    function(){

                        controller.abort();

                    },
                    REQUEST_TIMEOUT_MS
                );


            try{

                const respuesta =
                    await fetch(
                        API,
                        {
                            method:"GET",

                            cache:"default",

                            credentials:"omit",

                            headers:{
                                "Accept":
                                    "application/json"
                            },

                            signal:
                                controller.signal
                        }
                    );


                if(!respuesta.ok){

                    throw new Error(
                        "HTTP " +
                        respuesta.status
                    );

                }


                const resultado =
                    await respuesta.json();


                const eventos =
                    Array.isArray(resultado)
                        ? resultado
                        : resultado?.data;


                if(
                    !Array.isArray(eventos)
                ){

                    throw new Error(
                        "El API no contiene eventos válidos."
                    );

                }


                /*
                GUARDAR CACHE
                */

                guardarCache(
                    resultado
                );


                ultimaActualizacion =
                    Date.now();


                /*
                MOSTRAR
                */

                mostrarAgenda(
                    resultado
                );


            }

            catch(error){

                console.error(
                    "Error cargando agenda:",
                    error
                );


                /*
                SI HAY CACHE,
                NO BORRAR LA AGENDA.
                */

                const cacheActual =
                    cargarCache();


                if(
                    cacheActual &&
                    cacheActual.data
                ){

                    mostrarAgenda(
                        cacheActual.data
                    );

                    return;

                }


                /*
                SOLO MOSTRAR ERROR
                SI NUNCA HUBO CONTENIDO
                */

                if(
                    !ultimoContenido
                ){

                    agenda.innerHTML = `

                        <div
                            class="mensaje"
                            style="color:#f87171;"
                        >

                            ❌ No se pudo cargar la agenda.

                            <br><br>

                            <small>

                                ${escaparHTML(
                                    error.message ||
                                    "Error de conexión"
                                )}

                            </small>

                        </div>

                    `;

                }

            }

            finally{

                clearTimeout(
                    timeout
                );

                solicitudEnCurso =
                    null;

            }

        })();


    return solicitudEnCurso;

}


/* =================================================
   PROGRAMAR ACTUALIZACION
================================================= */

function programarActualizacion(){

    if(
        temporizadorAgenda
    ){

        clearTimeout(
            temporizadorAgenda
        );

    }


    const retraso =

        REFRESH_MIN_MS +

        Math.floor(
            Math.random() *
            REFRESH_RANDOM_MS
        );


    temporizadorAgenda =

        setTimeout(
            async function(){

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    await obtenerAgenda(
                        false
                    );

                }


                programarActualizacion();

            },
            retraso
        );

}


/* =================================================
   INICIO
================================================= */

fechaHoy();


/*
MOSTRAR CACHE PRIMERO
*/

const cacheInicial =
    cargarCache();


if(
    cacheInicial &&
    cacheInicial.data
){

    mostrarAgenda(
        cacheInicial.data
    );

    ultimaActualizacion =
        Number(
            cacheInicial.timestamp
        ) || 0;

}


/*
CARGAR API

Si no hay cache:
mostrar "Cargando".

Si ya hay cache:
no borrar la agenda.
*/

const cacheReciente =

    cacheInicial &&

    Date.now() -
    cacheInicial.timestamp <
    CACHE_FRESH_MS;


if(!cacheReciente){

    obtenerAgenda(
        !cacheInicial
    );

}


/*
ACTUALIZACION AUTOMATICA
*/

programarActualizacion();


/* =================================================
   CUANDO VUELVE LA PESTAÑA
================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState !==
            "visible"
        ){

            return;

        }


        const tiempo =
            Date.now() -
            ultimaActualizacion;


        if(
            tiempo >= CACHE_FRESH_MS
        ){

            obtenerAgenda(
                false
            );

        }

    }
);


/* =================================================
   CUANDO VUELVE INTERNET
================================================= */

window.addEventListener(
    "online",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            obtenerAgenda(
                false
            );

        }

    }
);
