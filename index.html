<script>

/* =================================================

================================================= */

function abrirTelegram(event){

    event.preventDefault();

    const telegramApp =
        "tg://resolve?domain=tvlatin2021";

    const telegramWeb =

}


/* =================================================
   API
================================================= */

const API =
    "https://api.wqxag.com/diaries.json";


/* =================================================
   FECHA
================================================= */

function fechaHoy(){

    const hoy = new Date();

    const opciones = {

        weekday:'long',

        year:'numeric',

        month:'long',

        day:'numeric'

    };

    document.getElementById("fecha").innerText =

        hoy.toLocaleDateString(
            'es-ES',
            opciones
        );

}


/* =================================================
   CONVERTIR HORA
================================================= */

function convertirHora(hora){

    if(!hora){

        return "";

    }

    const partes =
        String(hora).split(":");

    if(partes.length < 2){

        return hora;

    }

    let h =
        parseInt(partes[0],10);

    let m =
        parseInt(partes[1],10);


    if(isNaN(h) || isNaN(m)){

        return hora;

    }


    /*
    Si el API entrega hora local,
    se mantiene la hora.
    */

    const periodo =
        h >= 12 ? "PM" : "AM";

    let hora12 =
        h % 12;

    if(hora12 === 0){

        hora12 = 12;

    }

    return (

        String(hora12).padStart(2,"0") +

        ":" +

        String(m).padStart(2,"0") +

        " " +

        periodo

    );

}


/* =================================================
   ABRIR / CERRAR CANALES
================================================= */

function toggle(id){

    const el =
        document.getElementById(
            "links" + id
        );

    if(!el){

        return;

    }


    if(el.style.display === "block"){

        el.style.display = "none";

    }
    else{

        el.style.display = "block";

    }

}


/* =================================================
   LIMPIAR URL
================================================= */

function limpiarURL(url){

    if(!url){

        return "";

    }


    url =
        String(url).trim();


    /*
    SI VIENE UN IFRAME
    */

    if(
        url.toLowerCase()
        .includes("<iframe")
    ){

        const match =
            url.match(
                /src=["']([^"']+)["']/i
            );

        if(match){

            url = match[1];

        }

    }


    url =
        url.trim();


    /*
    QUITAR RUTA EMBED
    */

    url =
        url.replace(
            "/embed/eventos.html",
            ""
        );


    /*
    BASE64
    */

    if(url.includes("?r=")){

        const parts =
            url.split("?r=");


        if(parts[1]){

            try{

                url =
                    atob(
                        decodeURIComponent(
                            parts[1]
                        )
                    );

            }

            catch(e){

                console.log(
                    "No se pudo decodificar Base64"
                );

            }

        }

    }


    /*
    PROTOCOLO //
    */

    if(
        url.startsWith("//")
    ){

        url =
            "https:" + url;

    }


    /*
    RUTA RELATIVA
    */

    if(
        url.startsWith("/")
    ){

        url =
            "https://la14hd.com" + url;

    }


    /*
    AGREGAR HTTPS
    */

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        url =
            "https://" + url;

    }


    return url;

}


/* =================================================
   OBTENER EMBEDS
================================================= */

function obtenerEmbeds(attributes){

    if(!attributes){

        return [];

    }


    /*
    FORMATO STRAPI

    embeds:
    {
        data: [...]
    }
    */

    if(
        attributes.embeds &&
        Array.isArray(
            attributes.embeds.data
        )
    ){

        return attributes.embeds.data;

    }


    /*
    POR SI EL API ENTREGA
    DIRECTAMENTE UN ARRAY
    */

    if(
        Array.isArray(
            attributes.embeds
        )
    ){

        return attributes.embeds;

    }


    return [];

}


/* =================================================
   CARGAR AGENDA
================================================= */

async function cargarAgenda(){

    const agenda =
        document.getElementById(
            "agenda"
        );


    agenda.innerHTML = `

        <div class="mensaje">

            ⏳ Cargando eventos...

        </div>

    `;


    try{

        console.log(
            "Consultando API:",
            API
        );


        const respuesta =
            await fetch(
                API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        console.log(
            "HTTP:",
            respuesta.status
        );


        if(!respuesta.ok){

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }


        const data =
            await respuesta.json();


        console.log(
            "API recibida:",
            data
        );


        /*
        VALIDAR DATA
        */

        if(
            !data ||
            !Array.isArray(data.data)
        ){

            throw new Error(
                "El API no contiene el formato data[] esperado."
            );

        }


        /*
        EVENTOS
        */

        let eventos =
            data.data;


        /*
        FILTRAR FÚTBOL
        */

        eventos =
            eventos.filter(
                function(evento){

                    const a =
                        evento.attributes || {};


                    /*
                    Si existe deportes,
                    filtrar fútbol.

                    Si no existe,
                    permitir el evento.
                    */

                    if(!a.deportes){

                        return true;

                    }


                    return String(
                        a.deportes
                    )
                    .toLowerCase()
                    .includes("futbol");

                }
            );


        /*
        ORDENAR POR HORA
        */

        eventos.sort(
            function(a,b){

                const horaA =
                    a.attributes?.diary_hour ||
                    "00:00";

                const horaB =
                    b.attributes?.diary_hour ||
                    "00:00";


                return String(horaA)
                    .localeCompare(
                        String(horaB)
                    );

            }
        );


        /*
        SI NO HAY EVENTOS
        */

        if(eventos.length === 0){

            agenda.innerHTML = `

                <div class="mensaje">

                    ⚠️ No hay eventos disponibles.

                </div>

            `;

            return;

        }


        let html = "";


        /*
        ==========================================
        CREAR EVENTOS
        ==========================================
        */

        eventos.forEach(
            function(evento,i){

                const a =
                    evento.attributes || {};


                /*
                HORA
                */

                const hora =
                    convertirHora(
                        a.diary_hour || ""
                    );


                /*
                DESCRIPCIÓN
                */

                const desc =
                    a.diary_description ||
                    "Evento deportivo";


                /*
                BANDERA
                */

                let bandera =
                    "https://img.agenda18.com/uploads/sin_imagen_d36205f0e8.png";


                try{

                    const imagen =
                        a.country
                        ?.data
                        ?.attributes
                        ?.image
                        ?.data
                        ?.attributes
                        ?.url;


                    if(imagen){

                        if(
                            imagen.startsWith(
                                "http"
                            )
                        ){

                            bandera =
                                imagen;

                        }
                        else{

                            bandera =
                                "https://img.agenda18.com" +
                                imagen;

                        }

                    }

                }

                catch(error){

                    console.log(
                        "Error obteniendo bandera:",
                        error
                    );

                }


                /*
                EVENTO
                */

                html += `

                <div
                    class="partido"
                    onclick="toggle(${i})"
                >

                    <div class="info">

                        <div class="hora">

                            ${hora}

                        </div>


                        <img
                            class="bandera"
                            src="${bandera}"
                            onerror="
                                this.src='https://img.agenda18.com/uploads/sin_imagen_d36205f0e8.png'
                            "
                        >


                        <div>

                            ${desc}

                        </div>

                    </div>


                    <div
                        class="links"
                        id="links${i}"
                    >

                `;


                /*
                ==================================
                EMBEDS
                ==================================
                */

                const embeds =
                    obtenerEmbeds(a);


                if(
                    embeds.length === 0
                ){

                    html += `

                        <div
                            style="
                                color:#94a3b8;
                                padding:8px 0;
                            "
                        >

                            No hay enlaces disponibles

                        </div>

                    `;

                }
                else{

                    embeds.forEach(
                        function(embed){

                            const ea =
                                embed?.attributes ||
                                embed ||
                                {};


                            const nombre =
                                ea.embed_name ||
                                "Ver canal";


                            const iframe =
                                ea.embed_iframe ||
                                ea.embed_url ||
                                ea.url ||
                                "";


                            if(!iframe){

                                return;

                            }


                            const urlOriginal =
                                limpiarURL(
                                    iframe
                                );


                            if(!urlOriginal){

                                return;

                            }


                            /*
                            CREAR PLAYER
                            */

                            const urlPlayer =

                                "https://verfutbollibre.github.io/eventos.html?r=" +

                                encodeURIComponent(
                                    btoa(
                                        urlOriginal
                                    )
                                );


                            html += `

                            <a
                                href="${urlPlayer}"
                                target="_blank"
                                rel="noopener noreferrer"
                                onclick="event.stopPropagation();"
                            >

                                ▶ ${nombre}

                            </a>

                            `;

                        }
                    );

                }


                html += `

                    </div>

                </div>

                `;

            }
        );


        /*
        MOSTRAR
        */

        agenda.innerHTML =
            html;


        console.log(
            "Eventos mostrados:",
            eventos.length
        );


    }

    catch(error){

        console.error(
            "ERROR CARGANDO API:",
            error
        );


        agenda.innerHTML = `

            <div
                class="mensaje"
                style="
                    color:#f87171;
                "
            >

                ❌ No se pudo cargar la agenda.

                <br><br>

                <small
                    style="
                        color:#94a3b8;
                    "
                >

                    ${error.message}

                </small>

            </div>

        `;

    }

}

fechaHoy();

</script>
